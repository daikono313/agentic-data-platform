version: 2

models:
  - name: dim_date
    description: 日付ディメンション（When）。範囲は dbt_project.yml の vars（adp_date_start / adp_date_end）。MetricFlow の time spine を兼ねる
    semantic_model:
      enabled: true
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: 日付
        granularity: day
        data_tests: [unique, not_null]
        entity: {type: primary, name: date}
      - {name: calendar_year, description: 年, dimension: {type: categorical}}
      - {name: calendar_quarter, description: 四半期, dimension: {type: categorical}}
      - {name: calendar_month, description: 月, dimension: {type: categorical}}
      - {name: month_start, description: 月初日}
      - {name: week_start, description: 週の開始日（月曜）}
      - {name: day_of_week, description: 曜日番号（1=月曜〜7=日曜）, dimension: {type: categorical}}
      - {name: day_of_week_name, description: 曜日名, dimension: {type: categorical}}
      - {name: is_weekend, description: 土日かどうか, dimension: {type: categorical}}

  - name: dim_customer
    description: 顧客ディメンション（Who）。SCD Type1。customer_id が NULL の行は不明メンバー
    semantic_model:
      enabled: true
    columns:
      - name: customer_key
        description: サロゲートキー
        data_tests: [unique, not_null]
        entity: {type: primary, name: customer}
      - {name: customer_id, description: 顧客ID（自然キー）}
      - {name: customer_name, description: 顧客名, dimension: {type: categorical}}
      - {name: gender, description: 性別, dimension: {type: categorical}}
      - {name: birth_date, description: 生年月日}
      - {name: prefecture, description: 居住都道府県, dimension: {type: categorical}}
      - {name: region, description: 居住地方, dimension: {type: categorical}}
      - {name: membership_rank, description: 会員ランク, dimension: {type: categorical}}
      - {name: signup_date, description: 会員登録日}

  - name: dim_product
    description: 商品ディメンション（What）。SCD Type1
    semantic_model:
      enabled: true
    columns:
      - name: product_key
        description: サロゲートキー
        data_tests: [unique, not_null]
        entity: {type: primary, name: product}
      - {name: product_id, description: 商品ID（自然キー）}
      - {name: product_name, description: 商品名, dimension: {type: categorical}}
      - {name: category, description: 商品カテゴリ, dimension: {type: categorical}}
      - {name: subcategory, description: 商品サブカテゴリ, dimension: {type: categorical}}
      - {name: brand, description: ブランド, dimension: {type: categorical}}
      - {name: list_price, description: 定価（円・税抜）}

  - name: dim_store
    description: 店舗・チャネルディメンション（Where）。SCD Type1
    semantic_model:
      enabled: true
    columns:
      - name: store_key
        description: サロゲートキー
        data_tests: [unique, not_null]
        entity: {type: primary, name: store}
      - {name: store_id, description: 店舗ID（自然キー）}
      - {name: store_name, description: 店舗名, dimension: {type: categorical}}
      - name: channel
        dimension: {type: categorical}
        description: 販売チャネル（store / online / app。不明メンバーは「不明」）
        data_tests:
          - accepted_values: {arguments: {values: [store, online, app, 不明]}}
      - {name: prefecture, description: 所在都道府県（online / app は NULL）, dimension: {type: categorical}}
      - {name: region, description: 所在地方（online / app は NULL）, dimension: {type: categorical}}

  - name: dim_promotion
    description: プロモーションディメンション（Why）。適用なしの注文は「プロモーションなし」の行を参照する
    semantic_model:
      enabled: true
    columns:
      - name: promotion_key
        description: サロゲートキー
        data_tests: [unique, not_null]
        entity: {type: primary, name: promotion}
      - {name: promotion_id, description: プロモーションID（自然キー）}
      - {name: promotion_name, description: プロモーション名, dimension: {type: categorical}}
      - name: promotion_type
        dimension: {type: categorical}
        description: 種類（percent_off / point_up / bundle。不明メンバーは「プロモーションなし」を表す none）
        data_tests:
          - accepted_values: {arguments: {values: [percent_off, point_up, bundle, none]}}
      - {name: discount_rate, description: 割引率}
