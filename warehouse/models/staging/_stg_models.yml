version: 2

models:
  - name: stg_customers
    description: 顧客（raw.customers を整形）
    columns:
      - {name: customer_id, data_tests: [unique, not_null]}
  - name: stg_products
    description: 商品（raw.products を整形）
    columns:
      - {name: product_id, data_tests: [unique, not_null]}
  - name: stg_stores
    description: 店舗・チャネル（raw.stores を整形）
    columns:
      - {name: store_id, data_tests: [unique, not_null]}
  - name: stg_promotions
    description: プロモーション（raw.promotions を整形）
    columns:
      - {name: promotion_id, data_tests: [unique, not_null]}
  - name: stg_orders
    description: 注文ヘッダ（raw.orders を整形）
    columns:
      - {name: order_id, data_tests: [unique, not_null]}
      - {name: ordered_on, description: 注文日}
  - name: stg_order_items
    description: 注文明細（raw.order_items を整形）
    columns:
      - {name: order_item_id, data_tests: [unique, not_null]}
