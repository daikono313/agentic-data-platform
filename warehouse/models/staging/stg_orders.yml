# adp.cleansing により生成（warehouse/cleansing/raw.orders.yml）。手で編集しない（make cleansing）
version: 2
models:
- name: stg_orders
  description: 注文ヘッダ（raw.orders を整形）
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
  - name: ordered_on
    description: 注文日
  - name: order_status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - completed
          - cancelled
          - returned
