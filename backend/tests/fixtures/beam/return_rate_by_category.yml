metrics:
- name: returned_qty_total
  label: 返品数量
  question: 商品カテゴリ別の返品率を知りたい
  framed_question: 商品カテゴリ別の返品数量はいくつか（返品率の分子）
  type: simple
  event: customer_returns_product
  measure: returned_qty
  filters: []
  group_by:
  - product.category
  - returned_at.month
  - return_reason.return_reason
  status: draft
- name: sold_qty_excl_cancelled
  label: 販売数量（キャンセル除く）
  question: 商品カテゴリ別の返品率を知りたい
  framed_question: 商品カテゴリ別の販売数量はいくつか（キャンセル注文を除く。返品率の分母）
  type: simple
  event: customer_orders_product
  measure: quantity
  filter: キャンセルされた注文を除く
  filters:
  - ref: order_status.order_status
    operator: '!='
    values:
    - cancelled
  group_by:
  - product.category
  - ordered_at.month
  status: draft
- name: return_rate_by_category
  label: 商品カテゴリ別の返品率
  question: 商品カテゴリ別の返品率を知りたい
  framed_question: 商品カテゴリ別に、販売数量（キャンセル注文を除く）のうち返品された数量の割合はいくつか
  type: ratio
  event: customer_returns_product
  numerator: returned_qty_total
  denominator: sold_qty_excl_cancelled
  filters: []
  group_by:
  - product.category
  status: draft
