# 手書きのリファレンス（生成結果との比較用）。元は warehouse/models/marts/_marts.yml
version: 2

models:
  - name: fct_order_lines
    description: |
      注文明細ファクト（transaction fact）。
      元イベント: 顧客が商品を注文する。粒度: 注文明細 1 行（1 注文の中の 1 商品）
    semantic_model:
      enabled: true
    agg_time_dimension: ordered_on
    derived_semantics:
      entities:
        # When（注文日）から dim_date の属性（曜日・土日など）を引けるようにする
        - {type: foreign, name: date, expr: ordered_on}
    columns:
      - name: order_line_id
        description: 注文明細番号（縮退ディメンション）
        data_tests: [unique, not_null]
        entity: {type: primary, name: order_line}
      - name: order_id
        description: 注文番号（縮退ディメンション）
        data_tests: [not_null]
        dimension: {type: categorical}
      - name: customer_key
        entity: {type: foreign, name: customer}
        description: 顧客（dim_customer）
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_customer'), field: customer_key}}
      - name: product_key
        entity: {type: foreign, name: product}
        description: 商品（dim_product）
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_product'), field: product_key}}
      - name: store_key
        entity: {type: foreign, name: store}
        description: 店舗（dim_store）
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_store'), field: store_key}}
      - name: promotion_key
        entity: {type: foreign, name: promotion}
        description: プロモーション（dim_promotion）
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_promotion'), field: promotion_key}}
      - name: ordered_on
        description: 注文日（dim_date）
        granularity: day
        dimension: {type: time}
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_date'), field: date_day}}
      - {name: ordered_at, description: 注文日時}
      - name: order_status
        description: 注文ステータス
        dimension: {type: categorical}
        data_tests:
          - accepted_values: {arguments: {values: [completed, cancelled, returned]}}
      - {name: payment_method, description: 支払方法（How。属性が1つだけなので dim を作らず fct に置く）, dimension: {type: categorical}}
      - {name: quantity, description: 数量}
      - {name: unit_price, description: 販売単価（円・税抜）}
      - {name: discount_amount, description: 値引額（円・税抜）}
      - {name: sales_amount, description: 売上金額（数量 × 単価 − 値引、円・税抜）。キャンセルされた明細も含むので、指標ではステータスで絞る}
    metrics:
      - name: revenue
        label: 売上金額
        description: 売上金額（円・税抜、値引後）。キャンセルを除く
        type: simple
        agg: sum
        expr: sales_amount
        filter: "{{ Dimension('order_line__order_status') }} <> 'cancelled'"
      - name: order_quantity
        label: 販売数量
        description: 販売数量。キャンセルを除く
        type: simple
        agg: sum
        expr: quantity
        filter: "{{ Dimension('order_line__order_status') }} <> 'cancelled'"
      - name: order_count
        label: 注文件数
        description: キャンセルを除く注文の件数
        type: simple
        agg: count_distinct
        expr: order_id
        filter: "{{ Dimension('order_line__order_status') }} <> 'cancelled'"
      - name: order_line_count
        label: 注文明細数
        description: キャンセルを除く注文明細の件数
        type: simple
        agg: count
        expr: 1
        filter: "{{ Dimension('order_line__order_status') }} <> 'cancelled'"

unit_tests:
  - name: test_fct_order_lines_from_beam_example
    description: |
      BEAM の具体例（gold 会員が食品を2個、単価300円で購入）から作った unit test。
      measure と縮退ディメンションは expect で検証し、dim の属性や When は given の入力行を作るのに使う。
      プロモーションなしの注文は不明メンバーのキー（md5("__unknown__")）になることも検証する。
    model: fct_order_lines
    given:
      - input: ref('stg_order_items')
        rows:
          - {order_item_id: 1, order_id: 10, product_id: 5, quantity: 2, unit_price: 300, discount_amount: 0}
          - {order_item_id: 2, order_id: 10, product_id: 6, quantity: 1, unit_price: 1000, discount_amount: 100}
      - input: ref('stg_orders')
        rows:
          - {order_id: 10, customer_id: 1, store_id: 1, ordered_at: "2024-03-01 10:00:00", ordered_on: "2024-03-01", promotion_id: null, order_status: completed, payment_method: cash}
    expect:
      rows:
        - {order_line_id: 1, order_id: 10, ordered_on: "2024-03-01", quantity: 2, sales_amount: 600, promotion_key: 4fb8d4763fa5f060e796b4710c921eb8}
        - {order_line_id: 2, order_id: 10, ordered_on: "2024-03-01", quantity: 1, sales_amount: 900, promotion_key: 4fb8d4763fa5f060e796b4710c921eb8}

metrics:
  - name: average_order_value
    label: 平均注文単価
    description: 売上金額 ÷ 注文件数（どちらもキャンセルを除く）
    type: ratio
    numerator: revenue
    denominator: order_count
  - name: revenue_mtd
    label: 売上金額（月初来累計）
    description: 月初からの売上金額の累計
    type: cumulative
    input_metric: revenue
    grain_to_date: month
    # 月や年の粒度で集計したとき、期間の最終日の累計値を返す（既定の first だと初日の値になる）
    period_agg: last
  - name: revenue_rolling_7d
    label: 売上金額（直近7日）
    description: 直近7日間の売上金額の合計
    type: cumulative
    input_metric: revenue
    window: 7 days
    period_agg: last
