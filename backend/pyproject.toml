[project]
name = "adp"
version = "0.1.0"
description = "BEAM✲ 対話型データモデリング基盤"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "sqlmodel>=0.0.48",
  "duckdb>=1.5,<1.6",
  "claude-agent-sdk>=0.2.165",
  "dbt-core>=1.12,<1.13",
  "dbt-duckdb>=1.11",
  "dbt-metricflow[dbt-duckdb]>=0.15",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["adp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*", "dbt.*", "metricflow.*", "sse_starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
