# オントロジーの正本（#67）。docs/ontology.md はここから生成する（make ontology）。
# 手で md を編集しない。取り込み（#69）と生成（作った fct / dim の書き込み）が
# この形で書き直すので、コメントはここ（adp.ontology.models.HEADER）に書く。
#
# - domains: 業務のまとまり（図の枠）
# - concepts: 概念。kind は entity（もの・人・場所）か event（出来事。fact の候補）
#   - source / key: 概念の元になる源泉のテーブルと、その識別子の列
#   - attributes: 属性。column は source の列
#   - model: 対応する整備済みモデル（entity → dim_*、event → fct_*）。まだ無ければ省略
# - relations: 概念どうしの関係。verb は from → to の矢印のラベル（動詞）
#   - via: 関係を表す列（<schema>.<table>.<column>）
# - constraints: 業務上の制約・注意（図の注記）
version: 1
domains:
- name: sales
  label: 販売
- name: merchandise
  label: 商品
- name: customer
  label: 顧客
- name: channel
  label: 店舗・チャネル
- name: fulfillment
  label: 決済・配送・返品
concepts:
- name: customer
  label: 顧客
  domain: customer
  kind: entity
  source: raw.customers
  key: customer_id
  model: dim_customer
  attributes:
  - name: customer_name
    label: 顧客名
    column: customer_name
  - name: gender
    label: 性別
    column: gender
  - name: birth_date
    label: 生年月日
    column: birth_date
  - name: prefecture
    label: 居住都道府県
    column: prefecture
  - name: region
    label: 居住地方
    column: region
  - name: membership_rank
    label: 会員ランク
    column: membership_rank
  - name: signup_date
    label: 会員登録日
    column: signup_date
- name: product
  label: 商品
  domain: merchandise
  kind: entity
  source: raw.products
  key: product_id
  model: dim_product
  attributes:
  - name: product_name
    label: 商品名
    column: product_name
  - name: category
    label: 商品カテゴリ
    column: category
  - name: subcategory
    label: 商品サブカテゴリ
    column: subcategory
  - name: brand
    label: ブランド
    column: brand
  - name: list_price
    label: 定価
    column: list_price
  - name: unit_cost
    label: 標準原価
    column: unit_cost
  - name: launched_on
    label: 発売日
    column: launched_on
- name: store
  label: 店舗・チャネル
  domain: channel
  kind: entity
  source: raw.stores
  key: store_id
  model: dim_store
  attributes:
  - name: store_name
    label: 店舗名
    column: store_name
  - name: channel
    label: 販売チャネル
    column: channel
  - name: prefecture
    label: 所在都道府県
    column: prefecture
  - name: region
    label: 所在地方
    column: region
  - name: opened_on
    label: 開店日
    column: opened_on
- name: promotion
  label: プロモーション
  domain: sales
  kind: entity
  source: raw.promotions
  key: promotion_id
  model: dim_promotion
  attributes:
  - name: promotion_name
    label: プロモーション名
    column: promotion_name
  - name: promotion_type
    label: 種類
    column: promotion_type
  - name: discount_rate
    label: 割引率
    column: discount_rate
  - name: start_date
    label: 開始日
    column: start_date
  - name: end_date
    label: 終了日
    column: end_date
- name: order
  label: 注文
  domain: sales
  kind: event
  source: raw.orders
  key: order_id
  attributes:
  - name: ordered_at
    label: 注文日時
    column: ordered_at
  - name: order_status
    label: 注文ステータス
    column: order_status
  - name: payment_method
    label: 支払方法
    column: payment_method
- name: order_line
  label: 注文明細
  domain: sales
  kind: event
  source: raw.order_items
  key: order_item_id
  model: fct_order_lines
  attributes:
  - name: quantity
    label: 数量
    column: quantity
  - name: unit_price
    label: 販売単価
    column: unit_price
  - name: discount_amount
    label: 値引額
    column: discount_amount
- name: payment
  label: 支払
  domain: fulfillment
  kind: event
  source: raw.payments
  key: payment_id
  attributes:
  - name: payment_method
    label: 支払方法
    column: payment_method
  - name: amount
    label: 支払金額
    column: amount
  - name: paid_at
    label: 支払日時
    column: paid_at
- name: shipment
  label: 配送
  domain: fulfillment
  kind: event
  source: raw.shipments
  key: shipment_id
  attributes:
  - name: shipping_method
    label: 配送方法
    column: shipping_method
  - name: shipped_at
    label: 出荷日時
    column: shipped_at
  - name: delivered_at
    label: 配達日時
    column: delivered_at
- name: return
  label: 返品
  domain: fulfillment
  kind: event
  source: raw.returns
  key: return_id
  attributes:
  - name: returned_at
    label: 返品日時
    column: returned_at
  - name: quantity
    label: 返品数量
    column: quantity
  - name: return_reason
    label: 返品理由
    column: return_reason
relations:
- from: customer
  to: order
  verb: 注文する
  via: raw.orders.customer_id
- from: store
  to: order
  verb: 受け付ける
  via: raw.orders.store_id
- from: promotion
  to: order
  verb: 適用される
  via: raw.orders.promotion_id
- from: order
  to: order_line
  verb: 含む
  via: raw.order_items.order_id
- from: order_line
  to: product
  verb: 購入する
  via: raw.order_items.product_id
- from: order
  to: payment
  verb: 支払われる
  via: raw.payments.order_id
- from: order
  to: shipment
  verb: 配送される
  via: raw.shipments.order_id
- from: order_line
  to: return
  verb: 返品される
  via: raw.returns.order_item_id
constraints:
- concept: store
  text: channel が online / app の店舗は都道府県・地方を持たない
- concept: order
  text: 1 明細でも返品があれば order_status は returned
- concept: shipment
  text: online / app の注文のみ配送がある
- concept: product
  text: unit_cost は標準原価で、実績原価ではない
