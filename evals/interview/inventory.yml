# v3 の E2E（#69）: 取り込んだ新しい源泉（raw.inventory）の指標を要求する
name: inventory
request: 店舗ごと・商品カテゴリごとの入荷数量を月別に見たい
persona: |
  あなたは小売企業の店舗運営の担当です。データの専門家ではありません。
  知っていること・望んでいること:
  - 実店舗ごと・商品カテゴリごとに、商品がどれだけ入荷したか（入荷数量）を月別に見たい。
  - 在庫の入出庫の記録には、入荷のほかに他店への移動・廃棄・棚卸の差異があるが、見たいのは入荷だけ（聞かれたら答える）。
  - 優先度は高い。
checks:
  - finalizable
  - has_w: [what, when, where]
  - min_events: 1
