# S5 / v3 の E2E（#118）: まだオントロジーに無い新しい源泉（raw.reviews。商品レビュー）の指標を要求する。
# 既存の fact には無く、データ全体にある要求。make eval ではプロファイルからの追加案で取り込んだものと
# して設計を確かめ、make e2e V3=1 では本物の取り込み（エージェント → PR）をしてから生成する
name: reviews
request: 商品カテゴリ別の平均評価（レビューの点数）を月別に見たい
onboard: raw.reviews
persona: |
  あなたは EC 事業の商品企画の担当です。データの専門家ではありません。
  知っていること・望んでいること:
  - 購入した商品に付けられたレビューの点数（1〜5 の 5 段階）の平均を、商品カテゴリごと・レビューが書かれた月ごとに見たい。
  - 1 件のレビューが 1 行。レビューの文章は見なくてよい（点数だけ）。
  - 評価の低いカテゴリを見つけて、商品の見直しに使いたい（目的を聞かれたら答える）。
  - 優先度は高い。
checks:
  - finalizable
  - min_examples: 2
  - fact_source: raw.reviews
  - has_w: [what, when]
  - metric_group_by_columns: [raw.products.category, raw.reviews.reviewed_at]
  - asks_purpose
