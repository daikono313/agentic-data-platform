# #204: 出来事の件数だけの要求（factless fact）。会話は合成。
# 源泉は raw.shipments（1 行が配送 1 件）。数える列は無く、行の数を数える。
name: shipment_count
request: 配送方法ごとに、月別の出荷の件数を見たい
persona: |
  あなたは EC 企業の物流の担当です。データの専門家ではありません。
  知っていること・望んでいること:
  - 1 回の出荷を 1 件と数える。金額や個数ではなく、件数だけを見たい。
  - 配送方法ごと・出荷した月ごとに、件数を見たい。
  - 配送業者との契約の枠を見直す判断に使いたい（目的を聞かれたら答える）。
  - 優先度は中くらい。
checks:
  - finalizable
  - story_type: discrete
  - metric_aggregation: count
  # 件数は source を書かず、行を数える（キーの列を数えない。#204）
  - metric_counts_rows: raw.shipments
  - min_examples: 2
  - asks_purpose
  - metric_purpose
  - metric_group_by_columns: [raw.shipments.shipping_method, raw.shipments.shipped_at]
