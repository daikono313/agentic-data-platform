# design-doc S1
name: sales_by_store
request: 店舗ごとの売上を見たい
persona: |
  あなたは EC と実店舗を運営する小売企業の営業企画担当です。データの専門家ではありません。
  知っていること・望んでいること:
  - 店舗ごとの売上金額を日別に見たい。チャネル（店舗 / オンライン / アプリ）別にも見たい。
  - 売上は「注文した時点」で数える。キャンセルされた注文は売上に含めない。税抜でよい。
  - 商品カテゴリ別や、会員ランク別の切り口もあると嬉しい。
  - 顧客の年収別にも見られると嬉しい（データが無いと言われたら諦める）。
  - プロモーションの効果も見たいが、優先度は低い。
  - 会員ランクは変わることがあるが、今のランクで見られればよい。
  - 売上の伸びない店舗を見つけて、販促の計画を立てるのに使いたい（目的を聞かれたら答える）。
  - 優先度は高い。効果も大きい。工数はおまかせ。
checks:
  - finalizable
  - has_w: [who, what, when, where]
  - has_gap: data_unavailable
  - min_examples: 1
  - metric_filter: {column: raw.orders.order_status, excludes: [cancelled]}
  - metric_group_by_columns: [raw.stores.store_name, raw.stores.channel, raw.orders.ordered_at]
  - asks_purpose
