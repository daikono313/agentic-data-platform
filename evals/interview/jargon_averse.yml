# 専門用語がわからない回答者でも進められるか（#45。フィードバックの分類「専門用語がわからない」
# 「質問が長い・多い」から作った合成のシナリオ。実際の会話は含まない）
name: jargon_averse
request: 商品カテゴリごとの売れ行きが知りたい
persona: |
  あなたは EC 企業の商品企画の担当です。データやシステムの言葉はまったくわかりません。
  聞かれた中に「粒度」「ディメンション」「ファクト」「メジャー」などの言葉が説明なしで出てきたら、
  「すみません、〇〇ってどういう意味ですか？」と聞き返します。説明されれば答えます。
  見たいものは次のとおりです:
  - 月ごとに、商品カテゴリ別の売上金額（税抜）を見たい。注文した時点で数え、キャンセルは除く。
  - 1 行は「注文の中の 1 商品」でよい。
  - どのカテゴリの品ぞろえを増やすかを決めるのに使いたい（目的を聞かれたら答える）。
  - 優先度は高い。
checks:
  - finalizable
  - max_assistant_turns: 15
  - metric_filter: {column: raw.orders.order_status, excludes: [cancelled]}
  - metric_group_by_columns: [raw.products.category, raw.orders.ordered_at]
  - asks_purpose
