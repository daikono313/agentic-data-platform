# #76: 画面のフィードバック（工数は聞かなくてよい・具体例だけでなくイレギュラーなケースも知りたい）から
# 作ったシナリオ。会話は合成（実際の会話は入れない）。
name: stock_changes
request: 店舗ごとに在庫がどれだけ増えたり減ったりしたかを月別に見たい
persona: |
  あなたは小売企業の在庫管理の担当です。データの専門家ではありません。
  知っていること・望んでいること:
  - 店舗ごと・商品カテゴリごとに、在庫の増減（入ってきた数と出ていった数）を月別に見たい。
  - 在庫の記録には、入荷・他店への移動・廃棄・棚卸がある。棚卸は「数え直した在庫数」なので増減には含めない。
  - 例外として、他店への移動と廃棄は減る（聞かれたら答える）。移動を受け取った店の記録がデータに無ければ、出した店の減少だけでよい（受け取り側は後で考える）。
  - 作る手間はデータの担当者が見積もればよく、自分には分からない（聞かれたら「分からないので任せたい」と答える）。
  - 優先度とインパクトは高い。
checks:
  - finalizable
  - has_w: [what, when, where]
  - asks_irregular_cases
