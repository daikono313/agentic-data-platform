# #135: 状態が進んでいく出来事（evolving → accumulating snapshot）の要求。会話は合成。
# 源泉は raw.shipments（1 行に出荷日時とお届け日時がある）。
name: order_fulfillment
request: 出荷してからお届けまでに何日かかっているかを、配送方法ごとに月別で見たい
persona: |
  あなたは EC 企業の物流の担当です。データの専門家ではありません。
  知っていること・望んでいること:
  - 1 つの配送は、出荷 → お届け と進む。配送ごとに、出荷からお届けまでの日数を見たい。
  - 配送方法ごと・出荷した月ごとに、平均の日数を見たい。
  - お届けが遅い配送方法を見直す判断に使いたい（目的を聞かれたら答える）。
  - 優先度は中くらい。
checks:
  - finalizable
  - story_type: evolving
  - has_w: [when, how]
  - metric_aggregation: average
  - min_examples: 2
  - asks_purpose
