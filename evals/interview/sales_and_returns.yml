# #135: 2 つの出来事（販売と返品）で、共通のディメンション（商品・日付）がそろうか。会話は合成。
name: sales_and_returns
request: 商品カテゴリごとに、売れた数量と返品された数量を月別に並べて見たい
persona: |
  あなたは EC 企業の商品企画の担当です。データの専門家ではありません。
  知っていること・望んでいること:
  - 商品カテゴリごと（大分類 → 小分類で掘り下げたい）に、販売数量と返品数量を月別に並べて見たい（比率ではなく、それぞれの数量）。
  - 販売はキャンセルされた注文を除く。返品は返品を受け付けた日で数える（聞かれたら答える）。
  - 返品の多いカテゴリを見つけて、商品ページの説明を直す判断に使いたい（目的を聞かれたら答える）。
  - 優先度は中くらい。
checks:
  - finalizable
  - min_events: 2
  - shared_dimensions: [what, when]
  - has_hierarchy: product
  - asks_purpose
  - metric_filter: {column: raw.orders.order_status, excludes: [cancelled]}
  - metric_group_by_columns: [raw.products.category, raw.orders.ordered_at, raw.returns.returned_at]
