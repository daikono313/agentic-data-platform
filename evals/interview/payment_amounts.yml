# #113: 既存の fact に無く、データ全体（raw.payments。オントロジーの出来事「支払」）にある要求。
# 新しい fact（とクレンジング層）を作る
name: payment_amounts
request: 実際に支払われた金額を、支払方法ごと・月別に見たい
persona: |
  あなたは経理の担当です。データの専門家ではありません。
  知っていること・望んでいること:
  - 注文の金額ではなく、決済の記録（支払）で実際に支払われた金額を、支払方法ごと・支払った月ごとに見たい。
  - 1 件の支払が 1 行。返金はまだ考えなくてよい。
  - 支払方法ごとの入金額を確かめて、決済サービスの手数料の見直しに使いたい（目的を聞かれたら答える）。
  - 優先度は高い。
checks:
  - finalizable
  - min_examples: 2
  - fact_source: raw.payments
  - metric_group_by_columns: [raw.payments.payment_method, raw.payments.paid_at]
  - asks_purpose
